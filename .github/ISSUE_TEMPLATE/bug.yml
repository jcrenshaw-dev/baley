name: Bug
description: Something Baley does wrong, or a doc that says something false
type: Bug
labels: [needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead. Paste exact error text.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Stops me working
        - Wrong result, I can work around it
        - Minor or cosmetic
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest steps that show it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: The commit of Baley you built, and the version of Claude Code. Codex support has been removed because its sandboxing and execution controls do not meet Baley's requirements. Support may return when those requirements are met. Baley will not lower its security defaults to accommodate a host.
    validations:
      required: true
