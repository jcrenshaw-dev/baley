name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-test:
    # The Rust binary is the product. This is the suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installed by name, not left to rustup's auto-install: rustup 1.28
      # stopped installing the toolchain a rust-toolchain.toml names on first
      # use, so a job that only ran `cargo` would fail on the runner image
      # rather than build against the pinned compiler.
      - name: Install the toolchain rust-toolchain.toml pins
        run: |
          set -euo pipefail
          CHANNEL="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          if [ -z "$CHANNEL" ]; then
            echo "::error::rust-toolchain.toml names no channel"
            exit 1
          fi
          rustup toolchain install "$CHANNEL" --profile minimal
          rustup default "$CHANNEL"
          rustc --version

      # Restores compiled dependencies so a run rebuilds only this workspace.
      # Only main saves the cache; pull requests restore from it but never
      # write, so a branch cannot plant a build artifact main later trusts.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # --locked on both, because a committed Cargo.lock is the whole of what
      # "builds offline" means here and an unlocked resolve would quietly test
      # a dependency graph no commit records.
      # nextest runs every test as its own process and every binary at once;
      # cargo test runs the binaries one after another, and four of them held
      # three quarters of a fifteen-minute wall clock (D-176). Pinned and
      # fetched as a prebuilt archive so the job does not build the runner.
      - name: Install cargo-nextest
        run: |
          set -euo pipefail
          curl -LsSf https://get.nexte.st/0.9.144/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
          cargo nextest --version
      # No separate `cargo build`: the test build adds dev-dependency features,
      # so it recompiled the crate and some dependencies a second time anyway.
      # nextest builds everything the tests need, the binary included.
      - run: cargo nextest run --locked --workspace --no-fail-fast --build-jobs 6 --test-threads 6

  clippy:
    # Lint warnings fail their own check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain rust-toolchain.toml pins
        run: |
          set -euo pipefail
          CHANNEL="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          if [ -z "$CHANNEL" ]; then
            echo "::error::rust-toolchain.toml names no channel"
            exit 1
          fi
          rustup toolchain install "$CHANNEL" --profile minimal
          rustup default "$CHANNEL"
          rustc --version

      # Restores compiled dependencies so a run rebuilds only this workspace.
      # Only main saves the cache; pull requests restore from it but never
      # write, so a branch cannot plant a build artifact main later trusts.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The minimal toolchain needs Clippy installed explicitly.
      - run: rustup component add clippy
      - run: cargo clippy --workspace --all-targets --locked -j 6 -- -D warnings

      # baley-core must not reach the engine (design 0001, EVD-R12). The
      # forward tree is grepped: `cargo tree -i rusqlite` prints a warning and
      # exits 0 when nothing depends on it, so it cannot fail this step. Every
      # target and feature, so a macOS-only or optional edge cannot hide, and
      # the tree is captured first so a failed `cargo tree` fails the step
      # instead of reading as "not found".
      - name: baley-core cannot reach rusqlite
        run: |
          set -euo pipefail
          TREE="$(cargo tree -p baley-core -e normal --target all --all-features --prefix none --locked)"
          if grep -E '^(rusqlite|libsqlite3-sys) ' <<<"$TREE"; then
            echo "::error::baley-core depends on the SQLite engine"
            exit 1
          fi

      # baley-store is the storage port: it reaches neither the engine nor
      # the domain (design 0001, EVD-R12). Read the same way as above.
      - name: baley-store cannot reach rusqlite or baley-core
        run: |
          set -euo pipefail
          TREE="$(cargo tree -p baley-store -e normal --target all --all-features --prefix none --locked)"
          if grep -E '^(rusqlite|libsqlite3-sys|baley-core) ' <<<"$TREE"; then
            echo "::error::baley-store depends on the SQLite engine or baley-core"
            exit 1
          fi

  cargo-deny:
    # Advisories, licenses and sources for everything in Cargo.lock. Pinned
    # prebuilt release, same reason as nextest: the job does not build its tool.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-deny
        run: |
          set -euo pipefail
          V=0.20.2
          curl -LsSf "https://github.com/EmbarkStudios/cargo-deny/releases/download/$V/cargo-deny-$V-x86_64-unknown-linux-musl.tar.gz" \
            | tar zxf - --strip-components=1 -C "${CARGO_HOME:-$HOME/.cargo}/bin" "cargo-deny-$V-x86_64-unknown-linux-musl/cargo-deny"
          cargo deny --version
      - run: cargo deny --locked check

  fmt:
    # Formatting uses the same pinned compiler as the build checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain rust-toolchain.toml pins
        run: |
          set -euo pipefail
          CHANNEL="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          if [ -z "$CHANNEL" ]; then
            echo "::error::rust-toolchain.toml names no channel"
            exit 1
          fi
          rustup toolchain install "$CHANNEL" --profile minimal
          rustup default "$CHANNEL"
          rustc --version
          rustup component add rustfmt --toolchain "$CHANNEL"

      - run: cargo fmt --all --check
