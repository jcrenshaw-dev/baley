version: 2
# Version updates are held at zero open pull requests until the first release
# candidate (rc1). Each one moved main under the open build pull requests, and
# the strict required checks then made every one of them update and re-run.
# Security updates are not subject to this limit and still open.
# Each ecosystem waits seven days before taking a new version, so a release
# that turns out to be bad has a week to be pulled first.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
  # The .sentinel pin, so a kit change arrives as a pull request that runs the
  # new kit's checks before it is merged.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    # Dependabot reads 0.10 -> 0.11 as a minor update, but for a 0.x crate it breaks.
    # Only patches are grouped; minor and major bumps arrive one per pull request.
    groups:
      cargo:
        patterns:
          - "*"
        update-types:
          - "patch"
